plan_motion: true
ik_backend: ikfast

mount_group_blacklist:
  enabled: true
  path: yanpu_pnp/config/rack_mount_blacklist.yaml

# Optional task settings used while evaluating rack candidates.
# If omitted, the values in config/default.yaml tasks are used.
task_overrides:
  pick_symmetry_angle_count: 4
  place_symmetry_angle_count: 4

grid:
  base_pos:
    x:
      min: 0.8
      max: 1.0
      step: 0.1
    y:
      min: 0.3
      max: 0.5
      step: 0.1
    z:
      min: 0.6
      max: 0.8
      step: 0.05

  yaw_deg:
    min: 30.0
    max: 60.0
    step: 15.0

  arm_distance:
    min: 0.12
    max: 0.21
    step: 0.03

  left_arm_mount_euler_deg:
    roll:
      values: [-90, -60.0, -45.0, -30.0, 0.0]
    pitch:
      values: [0.0]
    yaw:
      # When roll is 0, yaw values are equivalent; search keeps only the first one.
      values: [0.0, 30.0, 45.0, 60.0, 90.0]
